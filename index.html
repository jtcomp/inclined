<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclined</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Inclined">
    <meta property="og:image" content="https://jtcomp.github.io/inclined/assets/full-poster-downres.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Inclined">
    <meta name="twitter:image" content="https://jtcomp.github.io/inclined/assets/full-poster-downres.png">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛰️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="poster-wrapper">
            <img src="assets/poster.png" alt="Poster" class="poster">
            <div class="fill-bar-container">
                <img src="assets/fill-bar.png" alt="Fill Bar" class="fill-bar">
            </div>
            <img src="assets/nick-cropped.png" alt="Nick" class="icon icon-nick">
            <img src="assets/tom-cropped.png" alt="Tom" class="icon icon-tom">
        </div>
    </div>

    <div class="text-section" id="output">
    </div>

    <script>
        function applyWonky() {
            const text = `
I'm raising money for the ACLU on my 29th birthday by Everesting

My friend, Nick and I will be running up and down 29,032 ft for 14 laps on the Manitou Incline

DM or text me if you've donated, and I'll update this page every day

(If I can't finish the Everest, I'll have to keep the mullet and mustache for a month)

            `;
            const output = document.getElementById('output');
            const rotationRange = 9;
            const verticalRange = 3;

            output.innerHTML = '';
            const lines = text.split('\n');

            lines.forEach((line, lineIndex) => {
                const words = line.split(' ');

                words.forEach((word, wordIndex) => {
                    const className = word.toLowerCase().replace(/[^a-z0-9]/g, '');
                    let wordSpan;

                    // this is a super hack
                    if (className === 'aclu' || className === 'everesting') {
                        const link = document.createElement('a');
                        link.href = className === 'aclu'
                            ? 'https://action.aclu.org/give/now'
                            : 'https://en.wikipedia.org/wiki/Everesting';
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        wordSpan = document.createElement('span');
                        wordSpan.style.display = 'inline-block';
                        wordSpan.style.whiteSpace = 'nowrap';
                        wordSpan.className = className;
                        link.appendChild(wordSpan);
                    } else {
                        wordSpan = document.createElement('span');
                        wordSpan.style.display = 'inline-block';
                        wordSpan.style.whiteSpace = 'nowrap';
                        wordSpan.className = className;
                    }

                    for (let char of word) {
                        const span = document.createElement('span');
                        span.textContent = char;

                        const rotation = (Math.random() - 0.5) * rotationRange * 2;
                        const verticalShift = (Math.random() - 0.5) * verticalRange * 2;
                        const scale = 0.95 + Math.random() * 0.1;

                        span.style.transform = `rotate(${rotation}deg) translateY(${verticalShift}px) scale(${scale})`;
                        wordSpan.appendChild(span);
                    }

                    if (className === 'aclu' || className === 'everesting') {
                        output.appendChild(wordSpan.parentElement);
                    } else {
                        output.appendChild(wordSpan);
                    }

                    if (wordIndex < words.length - 1) {
                        const space = document.createElement('span');
                        space.innerHTML = '&nbsp;';
                        output.appendChild(space);
                    }
                });

                if (lineIndex < lines.length - 1) {
                    output.appendChild(document.createElement('br'));
                }
            });
        }

        applyWonky();

        const nickIcon = document.querySelector('.icon-nick');
        const tomIcon = document.querySelector('.icon-tom');

        let hasScrolled = false;
        window.addEventListener('scroll', () => {
            if (!hasScrolled) {
                hasScrolled = true;

                const selectedIcon = Math.random() < 0.5 ? nickIcon : tomIcon;

                selectedIcon.style.animation = 'rattle 0.5s ease-in-out';

                setTimeout(() => {
                    selectedIcon.style.animation = '';
                }, 500);
            }
        });

        setTimeout(() => {
            const selectedIcon = Math.random() < 0.5 ? nickIcon : tomIcon;

            selectedIcon.style.animation = 'rattle 0.5s ease-in-out';

            setTimeout(() => {
                selectedIcon.style.animation = '';
            }, 500);
        }, 1000);
    </script>
</body>
</html>
